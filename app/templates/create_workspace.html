<!DOCTYPE html>
<html>
<head>
    <title>Create Workspace - Nexus</title>
</head>

<body>

    <h1>Create Workspace</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Workspace name"
            required
        >

        <br><br>

        <textarea
            name="description"
            placeholder="Description"
        ></textarea>

        <br><br>

        <button type="submit">
            Create Workspace
        </button>

    </form>

</body>
</html>

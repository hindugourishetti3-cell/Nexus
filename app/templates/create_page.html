<!DOCTYPE html>
<html>
<head>
    <title>
        {% if page %}
            Edit Page
        {% else %}
            Create Page
        {% endif %}
    </title>
</head>
<body>

    {% if page %}
        <h1>Edit Page</h1>
    {% else %}
        <h1>Create Page</h1>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="title"
            placeholder="Page title"
            value="{{ page.title if page else '' }}"
            required
        >

        <br><br>

        <textarea
            name="content"
            placeholder="Write your content..."
            rows="15"
            cols="60"
        >{{ page.content if page else '' }}</textarea>

        <br><br>

        <button type="submit">
            {% if page %}
                Save Changes
            {% else %}
                Create Page
            {% endif %}
        </button>

    </form>

</body>
</html>

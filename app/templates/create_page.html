<!DOCTYPE html>
<html>
<head>
    <title>Create Page</title>
</head>
<body>

    <h1>Create Page</h1>

    <form method="POST">

        <input
            type="text"
            name="title"
            placeholder="Page title"
            required
        >

        <br><br>

        <textarea
            name="content"
            placeholder="Write your content..."
            rows="15"
            cols="60"
        ></textarea>

        <br><br>

        <button type="submit">Create Page</button>

    </form>

</body>
</html>

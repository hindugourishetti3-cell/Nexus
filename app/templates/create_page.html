<!DOCTYPE html>
<html>
<head>
    <title>
        {% if page %}
            Edit Page
        {% else %}
            Create Page
        {% endif %}
    </title>
</head>

<body>

    {% if page %}
        <h1>Edit Page</h1>
    {% else %}
        <h1>Create Page</h1>
    {% endif %}

    <form method="POST">

        <label>Title</label>
        <br>

        <input
            type="text"
            name="title"
            placeholder="Page title"
            value="{{ page.title if page else '' }}"
            required
        >

        <br><br>

        <label>Content</label>
        <br>

        <textarea
            name="content"
            placeholder="Write your notes here..."
            rows="20"
            cols="80"
        >{{ page.content if page else '' }}</textarea>

        <br><br>

        <button type="submit">
            {% if page %}
                Save Changes
            {% else %}
                Create Page
            {% endif %}
        </button>

        {% if page %}
            <a href="{{ url_for('workspace.view_page', page_id=page.id) }}">
                Cancel
            </a>
        {% else %}
            <a href="{{ url_for('workspace.workspace_detail', workspace_id=workspace.id) }}">
                Cancel
            </a>
        {% endif %}

    </form>

</body>
</html>

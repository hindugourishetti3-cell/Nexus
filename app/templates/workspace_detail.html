<!DOCTYPE html>
<html>
<head>
    <title>{{ workspace.name }}</title>
</head>
<body>

    <h1>{{ workspace.name }}</h1>

    <p>{{ workspace.description }}</p>
    <a href="{{ url_for('workspace.edit_workspace', workspace_id=workspace.id) }}">
        Edit Workspace
    </a>
    <form
        method="POST"
        action="{{ url_for('workspace.delete_workspace', workspace_id=workspace.id) }}"
    >
        <button type="submit">Delete Workspace</button>
    </form>

    <hr>

    <h2>Pages</h2>

    <a href="{{ url_for('workspace.create_page', workspace_id=workspace.id) }}">
        + Create Page
    </a>

    <br><br>

    {% if pages %}

        {% for page in pages %}

            <div>
                <a href="{{ url_for('workspace.view_page', page_id=page.id) }}">
                    {{ page.title }}
                </a>
            </div>

        {% endfor %}

    {% else %}

        <p>No pages yet.</p>

    {% endif %}

</body>
</html>

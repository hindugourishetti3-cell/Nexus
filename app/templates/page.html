<!DOCTYPE html>
<html>
<head>
    <title>{{ page.title }}</title>
</head>
<body>

    <h1>{{ page.title }}</h1>

    <hr>

    <div>
        {{ rendered_content | safe }}
    </div>

    <br>

    <a href="{{ url_for('workspace.edit_page', page_id=page.id) }}">
        Edit Page
    </a>
    <form
        method="POST"
        action="{{ url_for('workspace.delete_page', page_id=page.id) }}"
    >
        <button type="submit">Delete Page</button>
    </form>
    <br>

    <a href="{{ url_for(
        'workspace.workspace_detail',
        workspace_id=page.workspace_id
    ) }}">
        ← Back to Workspace
    </a>

    <br><br>

    <a href="{{ url_for('workspace.workspaces') }}">
        ← All Workspaces
    </a>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexus - {{ page.title }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="app-shell">

    <aside class="sidebar">

        <a href="{{ url_for('dashboard') }}" class="brand">
            <span class="brand-mark">N</span>
            <span>Nexus</span>
        </a>

        <nav class="sidebar-nav">

            <a href="{{ url_for('dashboard') }}" class="nav-item">
                <span class="nav-icon">⌂</span>
                Dashboard
            </a>

            <a
                href="{{ url_for('workspace.workspaces') }}"
                class="nav-item active"
            >
                <span class="nav-icon">▣</span>
                Workspaces
            </a>

            <a href="{{ url_for('workspace.search') }}" class="nav-item">
                <span class="nav-icon">⌕</span>
                Search
            </a>

        </nav>

        <div class="sidebar-bottom">

            <div class="sidebar-divider"></div>

            <a href="{{ url_for('auth.logout') }}" class="nav-item">
                <span class="nav-icon">↪</span>
                Logout
            </a>

        </div>

    </aside>


    <div class="main-shell">

        <header class="topbar">

            <form
                class="top-search"
                method="GET"
                action="{{ url_for('workspace.search') }}"
            >
                <span>⌕</span>

                <input
                    type="text"
                    name="q"
                    placeholder="Search your knowledge..."
                >
            </form>

            <div class="topbar-user">

                <div class="avatar">
                    {{ current_user.username[0]|upper }}
                </div>

                <div class="user-info">
                    <strong>{{ current_user.username }}</strong>
                    <span>Knowledge space</span>
                </div>

            </div>

        </header>


        <main class="main-content">

            <div class="breadcrumb">

                <a href="{{ url_for('workspace.workspaces') }}">
                    Workspaces
                </a>

                <span>›</span>

                <span>
                    Page
                </span>

            </div>


            <div class="page-header">

                <div>

                    <p class="eyebrow">
                        Knowledge Page
                    </p>

                    <h1>
                        {{ page.title }}
                    </h1>

                </div>


                <div class="header-actions">

                    <a
                        href="{{ url_for(
                            'workspace.edit_page',
                            page_id=page.id
                        ) }}"
                        class="secondary-button"
                    >
                        Edit
                    </a>

                    <form
                        method="POST"
                        action="{{ url_for(
                            'workspace.delete_page',
                            page_id=page.id
                        ) }}"
                        onsubmit="return confirm(
                            'Delete this page?'
                        );"
                    >
                        <button
                            type="submit"
                            class="danger-button"
                        >
                            Delete
                        </button>
                    </form>

                </div>

            </div>


            <article class="page-content-card">

                <div class="markdown-content">
                    {{ rendered_content | safe }}
                </div>

            </article>


            <div class="page-footer">

                <a
                    href="{{ url_for(
                        'workspace.workspaces'
                    ) }}"
                    class="text-link"
                >
                    ← Back to Workspaces
                </a>

            </div>

        </main>

    </div>

</div>

</body>
</html>
